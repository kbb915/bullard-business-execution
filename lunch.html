<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lunch | Bullard Business Execution</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { background: #f7f5f0; color: #151b20; font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; margin: 0; min-height: 100vh; }
    main { margin: 0 auto; max-width: 1200px; padding: 24px 16px; }
    h1 { font-family: Georgia, serif; font-size: clamp(32px, 5vw, 52px); font-weight: 400; margin: 0 0 20px; }
    .calendar { background: #fffefa; border: 1px solid #d9d4ca; min-height: calc(100vh - 116px); overflow: hidden; }
    iframe { border: 0; display: block; height: calc(100vh - 118px); min-height: 720px; width: 100%; }
    .fallback { color: #315f76; font-size: 14px; margin: 14px 0 0; text-align: center; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Schedule lunch</h1>
    <div class="calendar">
      <div class="tidycal-embed" data-path="kevinbullard/coaching"></div>
      <script src="https://asset-tidycal.b-cdn.net/js/embed.js" async></script>
    </div>
    <p class="fallback">Having trouble viewing the calendar? <a href="https://meet.bullardbusinessexecution.com/lunch">Open it directly</a>.</p>
  </main>
</body>
</html>
